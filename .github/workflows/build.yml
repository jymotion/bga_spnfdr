# Builds both programs on each push. Each is a single small file, so they
# are offered as they are, not zipped:
#  - on a run's page (Actions tab -> the run -> Artifacts): bga_spnfdr.exe
#    and bga_spnfdr-linux-x64. GitHub only gives these to people who are
#    signed in, and deletes them after 90 days.
#  - on the Releases page, for anyone and for good, when a tag that starts
#    with "v" is pushed (e.g. v1.4.0): the "downloads" job below makes a
#    release of that name with both files on it.
name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Tests (shared Core code)
        run: dotnet test Tests -c Release
      - name: Windows app
        run: dotnet build Windows/bga_spnfdr.csproj -c Release -o out/windows
      - uses: actions/upload-artifact@v7
        with:
          path: out/windows/bga_spnfdr.exe
          archive: false # the file itself, named as it is

  linux:
    # built on the oldest supported Ubuntu so the program runs on as many
    # distros as possible (needs glibc 2.34+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Linux app
        run: |
          dotnet publish Linux/bga_spnfdr.csproj -c Release -o out/linux
          mv out/linux/bga_spnfdr out/linux/bga_spnfdr-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          path: out/linux/bga_spnfdr-linux-x64
          archive: false

  downloads:
    # Fetches both files the way a release would, and lists their sizes;
    # for a tag "v…" it then puts them on a release of that name.
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # for the release (tags only)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bga_spnfdr.exe
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: bga_spnfdr-linux-x64
          path: dist
      - name: Sizes, and the release for a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          windows=$(find dist -type f -name bga_spnfdr.exe)
          linux=$(find dist -type f -name bga_spnfdr-linux-x64)
          test -n "$windows" && test -n "$linux"
          ls -l "$windows" "$linux"
          file "$windows" "$linux"
          {
            echo "| Download | Bytes |"
            echo "|---|---|"
            echo "| bga_spnfdr.exe | $(stat -c %s "$windows") |"
            echo "| bga_spnfdr-linux-x64 | $(stat -c %s "$linux") |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" "$windows" "$linux" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" "$windows" "$linux" --repo "$GITHUB_REPOSITORY" --clobber
          fi
