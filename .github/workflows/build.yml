# Builds every app on each push; the files are downloadable from the run's
# page (Actions tab -> the run -> Artifacts).
name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Tests (shared Core code)
        run: dotnet test Tests -c Release
      - name: Windows app
        run: dotnet build Windows/bga_spnfdr.csproj -c Release -o out/windows
      - name: Windows app with Windows.Graphics.Capture (30 reads/s; not adopted yet)
        run: dotnet build Windows/bga_spnfdr.csproj -c Release -p:GraphicsCapture=true --no-incremental -o out/graphicscapture
      - name: Windows 30-reads-a-second test build (rotates capture methods, logs CPU and scores)
        run: dotnet build Windows/bga_spnfdr.csproj -c Release -p:PerfTest=true --no-incremental -o out/perftest
      - uses: actions/upload-artifact@v4
        with:
          name: bga_spnfdr-windows
          path: out/windows/bga_spnfdr.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bga_spnfdr-windows-graphics-capture
          path: out/graphicscapture/bga_spnfdr.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bga_spnfdr-windows-30fps-test
          path: out/perftest/bga_spnfdr_30fps_test.exe

  linux:
    # built on the oldest supported Ubuntu so the program runs on as many
    # distros as possible (needs glibc 2.34+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Linux app
        run: dotnet publish Linux/bga_spnfdr.csproj -c Release -o out/linux
      - uses: actions/upload-artifact@v4
        with:
          name: bga_spnfdr-linux-x64
          path: out/linux/bga_spnfdr
